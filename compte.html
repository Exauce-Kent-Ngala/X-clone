<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Création compte</title>
</head>
<body>
    <!-- PAGE COMPTE -->
    <header class="flex-row header_compte">
        <img class="icone-quitter" src="images/round_16171663.png" alt="" >
        <div class="flex-row header_compte_first_div">
            <img class="iconX-header" src="images/icone de X.jpg" alt="">
        </div>
    </header>
    <main class="flex-column main_compte">
        <form class="form-compte flex-column" action="" method="post">
            <h1 class="txtwhite">Créer votre compte</h1>
            <div class="flex-column save">
                <input type="text" required placeholder="Nom et prénom">
                <input type="tel" placeholder="Téléphone">
            </div>
            <div class="flex-row email-compte text-dec-none">
                <a class="txtbleu" href="">Utiliser un email</a>
            </div>
        </form>
        <h2>Date de naissance</h2>
        <p>Cette information ne sera pas affichée publiquement. Confirmez votre âge,même si ce compte
            est pour une entreprise, un animal de compagnie ou autre chose.
        </p>
    </main>
    <footer></footer>
</body>
</html>
