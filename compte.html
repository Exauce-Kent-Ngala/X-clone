<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Création compte</title>
</head>
<body>
    <!-- PAGE COMPTE -->
     <!-- header -->
    <header class="header_compte">
        <nav class="flex-row nav-compte">
            <ul class="flex-row icone-X-entete">
                <li class="ul-li"><a href="index.html"><svg class="icone-quitter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z"/></svg></a></li>
                <!-- <li class="ul-li"><a href="index.html"><img class="icone-quitter" src="images/round_16171663.png" alt="" ></a></li> -->
            </ul>
            <ul class="flex-row icX">
                <li class="ul-li"><a href="index.html"><svg class="iconeX" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free 7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M453.2 112L523.8 112L369.6 288.2L551 528L409 528L297.7 382.6L170.5 528L99.8 528L264.7 339.5L90.8 112L236.4 112L336.9 244.9L453.2 112zM428.4 485.8L467.5 485.8L215.1 152L173.1 152L428.4 485.8z"/></svg></a></li>
            </ul>
        </nav>
    </header>
    <!-- Partie main compte -->
    <main class="main-compte flex-column">
        <div class="formulaire-compte flex-column">
            <!-- premier formulaire -->
            <section class="first-formulaire flex-column">
                <!-- insertion des données -->
                <div class="conteneur-données flex-column">
                    <h1>Créer votre compte</h1>
                    <div class="flex-column save">
                        <input type="text" required placeholder="Nom et prénom">
                        <input type="tel" placeholder="Téléphone">
                    </div>
                </div>
                <!-- Utilisez email? -->
                <div class="conteneur-email flex-row">
                    <a href="">Utiliser un email</a>
                </div>
            </section>
            <!-- second formulaire -->
            <section class="flex-column born">
                <h2>Date de naissance</h2>
                <div><p>Cette information ne sera pas affichée publiquement. Confirmez votre âge,même si ce compte
                    est pour une entreprise, un animal de compagnie ou autre chose.</p>
                </div>
                <div class="date_born flex-row">
                    <select name="Mois" id="Mois">
                        <option value="">Mois</option>
                        <optgroup class="optiongroupe">
                            <option value="Janvier">Janvier</option>
                            <option value="Février">Février</option>
                            <option value="Mars">Mars</option>
                            <option value="Avril">Avril</option>
                            <option value="Mai">Mai</option>
                            <option value="Juin">Juin</option>
                            <option value="Juillet">Juillet</option>
                            <option value="Aout">Aout</option>
                            <option value="Septembre">Septembre</option>
                            <option value="Octobre">Octobre</option>
                            <option value="Novembre">Novembre</option>
                            <option value="Décembre">Décembre</option>
                        </optgroup>
                    </select>
                    <select name="Jour" id="Jour">
                        <option value="">Jour</option>
                        <optgroup></optgroup>
                    </select>
                    <select name="Année" id="Année">
                        <option value="">Année</option>
                        <optgroup></optgroup>
                    </select>
                </div>
            </section>
        </div>
    </main>
    <!-- FOOTER COMPTE -->
    <footer class="footer-compte flex-column">
        <div class="conteneur-footer flex-row">
            <div class="conteneur-suivant flex-row">
                <a href="">Suivant</a>
            </div>
        </div>
    </footer>
</body>
</html>
