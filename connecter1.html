    <!-- Main de connecter1 -->
    <main class="main-connecter1 flex-column">
        <!-- connexion par un compte déjà créer -->
        <section class="conteneur-compteCréer flex-column">
            <h1>Connectez-vous à X</h1>
            <div class="conteneurConnexion flex-column">
                <!-- Choix de compte pour se connecter -->
                <ul class="flex-column conteneurConnexion  listStyleNone">
                    <li class="flex-row connecterCompte"><img src="images/google.png" alt="" class="img-compte"><a href="" class="txtblack">Se connecter avec Google</a></li>
                    <li class="flex-row connecterCompte"><img src="images/AAPL.png" alt="" class="img-compte"><a href="" class="txtblack">Se connecter avec Apple</a></li>
                    <li class="OU-ligne flex-row">
                        <hr>
                        <span class="txtwhite">OU</span>
                        <hr>
                    </li>
                </ul>
                <!-- Se connecter en insérant les informations -->
                <div class="conteneurConnexion flex-column">
                    <div class="flex-column save">
                        <input type="tel and email" placeholder="Numéro téléphone,adresse email ">
                    </div>
                    <ul class="flex-column conteneurConnexion  listStyleNone">
                        <li class="flex-row connecterCompte "><a href="connecter2.html" class="txtblack btn-next">Suivant</a></li>
                        <li class=" flex-row monDePasseOublié text-dec-none"><a href="" class="txtwhite connexion">Mot de passe oublié?</a></li>
                    </ul>
                </div>
            </div>
        </section>
        <section class="pasDeCompte">
            <p class="text-dec-none">Vous n'avez pas de compte ? <a href="" class="txtbleu text-dec-none">Inscrivez-vous</a></p>
        </section>
    </main>

</html>
